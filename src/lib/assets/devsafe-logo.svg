<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 228" role="img" aria-labelledby="ds-logo-title">
  <title id="ds-logo-title">DevSafe</title>
  <defs>
    <linearGradient id="ds-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A6F4"/>
      <stop offset="0.55" stop-color="#9A63E0"/>
      <stop offset="1" stop-color="#5B3FA0"/>
    </linearGradient>
    <radialGradient id="ds-core" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2A2244"/>
      <stop offset="1" stop-color="#13111C"/>
    </radialGradient>
    <clipPath id="ds-inside">
      <path d="M104 18 L178 44 V108 C178 156 146 190 104 208 C62 190 30 156 30 108 V44 Z"/>
    </clipPath>
  </defs>

  <!-- Shield -->
  <path d="M104 12 L184 40 V108 C184 160 150 196 104 216 C58 196 24 160 24 108 V40 Z" fill="url(#ds-core)" stroke="url(#ds-rim)" stroke-width="10" stroke-linejoin="round"/>

  <g clip-path="url(#ds-inside)">
    <!-- Toghu band at the point of the shield -->
    <rect x="20" y="170" width="170" height="50" fill="#2A2146"/>
    <polyline points="20,196 30,184 40,196 50,184 60,196 70,184 80,196 90,184 100,196 110,184 120,196 130,184 140,196 150,184 160,196 170,184 180,196 190,184" fill="none" stroke="#A667E4" stroke-width="3.5" stroke-linejoin="miter"/>
    <polyline points="20,208 30,196 40,208 50,196 60,208 70,196 80,208 90,196 100,208 110,196 120,208 130,196 140,208 150,196 160,208 170,196 180,208 190,196" fill="none" stroke="#6B4FB0" stroke-width="3" stroke-linejoin="miter"/>
    <!-- Cameroon flag ribbon: green | red with the yellow star | yellow -->
    <rect x="20" y="156" width="57" height="14" fill="#007A5E"/>
    <rect x="77" y="156" width="54" height="14" fill="#CE1126"/>
    <rect x="131" y="156" width="59" height="14" fill="#FCD116"/>
    <path d="M104 157.2 l1.9 3.9 4.3 .6 -3.1 3 .7 4.3 -3.8 -2 -3.8 2 .7 -4.3 -3.1 -3 4.3 -.6z" fill="#FCD116"/>
  </g>

  <!-- Circuit trace: dev (build) to safe (protect) -->
  <path d="M33 138 L178 34" stroke="#13111C" stroke-width="12" stroke-linecap="round"/>
  <path d="M33 138 L178 34" stroke="#BF92EC" stroke-width="5" stroke-linecap="round"/>
  <circle cx="33" cy="138" r="9" fill="#13111C" stroke="#BF92EC" stroke-width="5"/>
  <circle cx="178" cy="34" r="9" fill="#13111C" stroke="#BF92EC" stroke-width="5"/>

  <!-- DS monogram -->
  <g transform="translate(15 0) skewX(-9)" stroke="#13111C" stroke-width="6" paint-order="stroke" stroke-linejoin="round">
    <path fill="#F7F7F8" fill-rule="evenodd" d="M50 62 H78 C101 62 114 78 114 100 C114 122 101 138 78 138 H50 Z M66 77 H77 C91 77 98 86 98 100 C98 114 91 123 77 123 H66 Z"/>
    <path fill="none" stroke="#13111C" stroke-width="23" stroke-linecap="butt" d="M162 74 C156 66 147 62 138 62 C126 62 118 69 118 80 C118 104 164 94 164 118 C164 131 154 138 140 138 C130 138 121 134 115 126"/>
    <path fill="none" stroke="#F7F7F8" stroke-width="15" stroke-linecap="butt" d="M162 74 C156 66 147 62 138 62 C126 62 118 69 118 80 C118 104 164 94 164 118 C164 131 154 138 140 138 C130 138 121 134 115 126"/>
  </g>
</svg>
